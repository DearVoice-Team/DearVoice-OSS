apiVersion: apps/v1
kind: Deployment
metadata:
  name: celery-beat
  namespace: dearvoice
  labels:
    app: celery-beat

spec:
  replicas: 1

  selector:
    matchLabels:
      app: celery-beat

  template:
    metadata:
      labels:
        app: celery-beat

    spec:
      containers:
        - name: celery-beat
          image: asia-northeast3-docker.pkg.dev/PROJECT_ID/REPOSITORY/backend:latest
          imagePullPolicy: Always

          command: ["celery"]
          args:
            - -A
            - config
            - beat
            - -l
            - info

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret

          env:
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /var/secrets/google/key.json

          volumeMounts:
            - name: google-tts-key
              mountPath: /var/secrets/google
              readOnly: true

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi

      volumes:
        - name: google-tts-key
          secret:
            secretName: google-tts-key
            items:
              - key: google-tts.json
                path: key.json
