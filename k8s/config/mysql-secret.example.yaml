# 예시 파일입니다. 실제 값은 절대 커밋하지 마세요.
# 사용법: 이 파일을 mysql-secret.yaml 로 복사 -> 값 채우기 -> kubectl apply -f
# (mysql-secret.yaml 은 k8s/.gitignore 대상)
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
  namespace: dearvoice
  labels:
    app.kubernetes.io/name: mysql
    app.kubernetes.io/part-of: dearvoice
type: Opaque
stringData:
  MYSQL_ROOT_PASSWORD: "change-me-root"
  MYSQL_DATABASE: "dearvoice_db"
  MYSQL_USER: "dearvoice_dev"
  MYSQL_PASSWORD: "change-me"
