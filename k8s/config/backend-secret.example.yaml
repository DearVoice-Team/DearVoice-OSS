# 예시 파일입니다. 실제 값은 절대 커밋하지 마세요.
# 사용법: 이 파일을 backend-secret.yaml 로 복사 -> 값 채우기 -> kubectl apply -f
# (backend-secret.yaml 은 k8s/.gitignore 대상)
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: dearvoice
  labels:
    app.kubernetes.io/name: backend
    app.kubernetes.io/part-of: dearvoice
type: Opaque
stringData:
  SECRET_KEY: "change-me-generate-a-new-random-secret-key"
  # mysql-secret 의 MYSQL_USER / MYSQL_PASSWORD 와 같은 값이어야 합니다.
  DB_USER: "dearvoice_dev"
  DB_PASSWORD: "change-me"
  AWS_ACCESS_KEY_ID: "your-aws-access-key-id"
  AWS_SECRET_ACCESS_KEY: "your-aws-secret-access-key"
  CLOVA_SPEECH_SECRET_KEY: "your-clova-speech-secret-key"
  CLOVA_SPEECH_INVOKE_URL: "https://your-clova-speech-invoke-url"
  OPENAI_API_KEY: "your-openai-api-key"
  EMAIL_HOST_USER: "your-sender@example.com"
  EMAIL_HOST_PASSWORD: "your-app-password"
