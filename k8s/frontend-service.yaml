apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: dearvoice
  labels:
    app: frontend
  annotations:
    cloud.google.com/neg: '{"ingress": true}'

spec:
  type: ClusterIP

  selector:
    app: frontend

  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
