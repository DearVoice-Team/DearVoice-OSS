apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: dearvoice
  labels:
    app: backend-migrate

spec:
  backoffLimit: 3

  template:
    metadata:
      labels:
        app: backend-migrate

    spec:
      restartPolicy: Never

      containers:
        - name: backend-migrate
          image: asia-northeast3-docker.pkg.dev/PROJECT_ID/REPOSITORY/backend:latest
          imagePullPolicy: Always

          command: ["python"]
          args:
            - manage.py
            - migrate
            - --noinput

          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secret

          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
